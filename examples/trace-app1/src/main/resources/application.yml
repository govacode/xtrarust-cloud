spring:
  application:
    name: app1

logging:
  file:
    name: app1.log
    path: logs
  logback:
    rollingpolicy:
      clean-history-on-start: true
      max-file-size: 500MB
      max-history: 7
      total-size-cap: 10GB
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:-} --- ${spring.application.name:-} %X{traceId:-} [%t] %-40.40logger{39} : %m%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:-} --- ${spring.application.name:-} %X{traceId:-} [%t] %-40.40logger{39} : %m%n'

management:
  endpoints:
    web:
      base-path: '/actuator'
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s # 每10秒推一次数据
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率：1.0 表示 100% 采样，生产环境建议降低