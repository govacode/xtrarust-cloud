apiVersion: 1
providers:
  # 面板分类组的名称
  - name: 'Default Dashboards'
    orgId: 1
    # 放置在根目录（也可以指定文件夹名称）
    folder: ''
    type: file
    # 是否禁止在 UI 上删除这些自动导入的面板
    disableDeletion: false
    # 导入后是否允许在 UI 上编辑
    editable: true
    options:
      path: /var/lib/grafana/dashboards # 容器内路径
    jsonData:
      DS_PROMETHEUS: Prometheus