management:
  endpoints:
    web:
      base-path: '/actuator'
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s # 每10秒推一次数据
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率：1.0 表示 100% 采样，生产环境建议降低